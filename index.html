            users,
            workspaces,
            auctions,
            alerts,
            updatedAt: new Date().toISOString(),

        } catch (err) {
          console.error('Firestore save error:', err);
        } finally {
          setTimeout(() => { isSavingCloud = false; }, 300);
        }
      }

        await saveCloudState();
        render();
        setToast('บันทึกบัญชีธนาคารและรหัสธุรกรรมเรียบร้อย');
      };
      window.clearMemberPin = async (phone) => {
        const ws = normalizeWorkspace(phone, workspaces[phone]);
        ws.withdrawalPin = null;
        workspaces[phone] = ws;
        await saveCloudState();
        render();
        setToast('ล้างรหัสธุรกรรม (รหัสถอน) เรียบร้อย');
      };
      window.toggleLvlLock = async (p, lv) => {
        const ws = normalizeWorkspace(p, workspaces[p]);
        ws.lockedLevels = ws.lockedLevels.includes(lv) ? ws.lockedLevels.filter((x) => x !== lv) : [...ws.lockedLevels, lv];
        workspaces[p] = ws;
        await saveCloudState();
        render();
      };
      window.toggleItemPriceLock = async (p, slotKey, itemId, priceBaht) => {
        const ws = normalizeWorkspace(p, workspaces[p]);
        const exists = ws.lockedItemIds.includes(slotKey) || ws.lockedItemIds.includes(itemId);
        if (exists) {
          ws.lockedItemIds = ws.lockedItemIds.filter((k) => k !== slotKey && k !== itemId);
          setToast(`ยกเลิกล็อกราคา ${fmt(priceBaht)} บาทแล้ว สามารถกดประมูลได้ตามปกติ`);
        } else {
          ws.lockedItemIds = [...ws.lockedItemIds, slotKey];
          setToast(`ล็อกราคา ${fmt(priceBaht)} บาทแล้ว สมาชิกจะไม่สามารถกดประมูลราคานี้ได้`);
        }
        workspaces[p] = ws;
        await saveCloudState();
        render();
      };

      render();
      loadCloudState();
    </script>
  </body>
</html>
