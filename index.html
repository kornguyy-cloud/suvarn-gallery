      let body = "";

      else if (st.accountPanel === "pin") body = ws.withdrawalPin ? `<div class="p-3.5 bg-[#FAF8F5] border border-[#C59B27]/50 rounded-lg space-y-2 text-xs"><p>ตั้งค่ารหัสถอนแล้ว (••••••) ไม่สามารถแก้ไขเองได้</p><a href="${LINE_URL}" target="_blank" rel="noopener noreferrer" class="btn-gold inline-block px-4 py-2">ทักหลังบ้าน LINE เพื่อขอเปลี่ยนรหัสถอน</a></div>` : `<form id="form-pin" class="space-y-3 text-sm"><input id="inp-pin-1" type="password" inputmode="numeric" maxlength="6" placeholder="รหัสถอน 6 หลัก" class="inp tabular-nums"/><input id="inp-pin-2" type="password" inputmode="numeric" maxlength="6" placeholder="ยืนยันรหัสถอน 6 หลัก" class="inp tabular-nums"/><button type="submit" class="btn-gold w-full py-2.5">บันทึกรหัสถอน 6 หลัก</button></form>`;  
      else if (st.accountPanel === "bank") body = ws.bankAccount ? `<div class="p-3.5 bg-[#FAF8F5] border border-[#C59B27]/50 rounded-lg space-y-2 text-xs"><p><b>${esc(ws.bankAccount.bankName)}</b> · ${esc(ws.bankAccount.accountHolder)} · ${maskBank(ws.bankAccount.accountNumber)}</p><a href="${LINE_URL}" target="_blank" rel="noopener noreferrer" class="btn-gold inline-block px-4 py-2">ทักหลังบ้าน LINE เพื่อเปลี่ยนบัญชี</a></div>` : `<form id="form-bank" class="space-y-3 text-sm"><select id="inp-bank-name" class="inp">${THAI_BANKS.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join("")}</select><input id="inp-bank-holder" type="text" placeholder="ชื่อ–นามสกุล เจ้าของบัญชี" class="inp"/><input id="inp-bank-num" type="text" inputmode="numeric" maxlength="12" placeholder="เลขที่บัญชี 10–12 หลัก" class="inp tabular-nums"/><button type="submit" class="btn-gold w-full py-2.5">ยืนยันผูกบัญชีธนาคาร</button></form>`;  
      else if (st.accountPanel === "history") body = ws.txHistory.length === 0 ? `<p class="text-sm text-center text-[#5C544B] py-4">ยังไม่มีรายการธุรกรรม</p>` : `<div class="divide-y divide-[#C59B27]/25 border border-[#C59B27]/35 rounded-lg">${ws.txHistory.map(t=>`<div class="p-3 flex justify-between gap-2 text-xs"><div><div class="font-semibold">${esc(t.title)}</div><div class="text-[#5C544B]">${fmtTime(t.timestamp)} · ${esc(t.status)}</div></div><b class="tabular-nums ${t.amountBaht>=0?"text-[#8C6A10]":""}">${t.amountBaht>=0?"+":""}${fmtBaht(t.amountBaht)} ฿</b></div>`).join("")}</div>`;  
      return `<div id="acc-modal-bg" class="fixed inset-0 z-50 bg-[#1E1B18]/50 flex items-center justify-center p-3"><div class="w-full max-w-lg bg-[#FFF] border-2 border-[#C59B27] rounded-2xl shadow-xl overflow-hidden" onclick="event.stopPropagation()"><div class="px-4 py-3 bg-[#FAF8F5] border-b border-[#C59B27]/40 flex justify-between items-center"><h2 class="font-editorial text-lg font-bold">${titles[st.accountPanel]||""}</h2><button id="btn-close-acc-modal" class="btn-out w-8 h-8">✕</button></div><div class="p-4 space-y-3 max-h-[80vh] overflow-y-auto">${st.panelErr?`<div class="p-2.5 bg-red-50 border border-red-200 rounded text-xs text-red-800">${esc(st.panelErr)}</div>`:""}${st.panelOk?`<div class="p-2.5 bg-emerald-50 border border-emerald-600 rounded text-xs text-emerald-950">${esc(st.panelOk)}</div>`:""}${body}</div></div></div>`;  
    }

      const members = Object.values(st.workspaces), q = st.adminSearch.trim().toLowerCase();  
      const fm = members.filter(m => !q || m.phone.includes(q.replace(/\D/g,"")) || m.memberId.toLowerCase().includes(q));  
      const sel = st.workspaces[st.adminSelectedPhone] || members[0];  
      const lvlItems = st.auctionItems.filter(i => i.level === st.adminLevel).sort((a,b) => a.slotIndex - b.slotIndex);  
      const isLvLk = sel.lockedLevels.includes(st.adminLevel);  
      const txs = sel.txHistory.filter(t => st.adminTxFilter === "pending" ? t.status === "รออนุมัติ" : true);  
      return `<main class="flex-1 py-4"><div class="max-w-7xl mx-auto px-3 sm:px-6 space-y-4">

          <div><p class="text-[11px] text-[#8C6A10] font-semibold">Back-Office Management · ระบบหลังบ้านผู้ดูแล</p><h1 class="font-editorial text-xl font-bold">จัดการสมาชิก ฝาก/ถอน และสิทธิ์การประมูล</h1></div>  
          <div class="flex gap-2">${sel.phone!==activePhone()?`<button id="btn-adm-switch" class="btn-gold px-3 py-2 text-xs">สลับมุมมองเป็นสมาชิกนี้</button>`:`<span class="px-3 py-1.5 bg-[#FAF8F5] border border-[#C59B27] text-xs text-[#8C6A10] rounded-lg font-semibold">กำลังซิงก์กับสมาชิกนี้</span>`}<button id="btn-adm-lock" class="btn-out px-3 py-2 text-xs">ล็อกหลังบ้าน</button></div>  
        </section>  
        <section class="card p-4 space-y-3">  
          <div class="flex flex-wrap justify-between gap-2"><h2 class="font-editorial text-lg font-bold">เลือกสมาชิก (${fm.length}/${members.length})</h2><input id="inp-adm-search" value="${esc(st.adminSearch)}" placeholder="ค้นหาเบอร์โทร / ID..." class="inp text-xs !w-64"/></div>  
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">${fm.map(m=>`<button data-adm-sel="${m.phone}" class="text-left p-3 rounded-xl border cursor-pointer ${m.phone===sel.phone?"bg-[#FAF8F5] border-[#C59B27] ring-2 ring-[#C59B27]/40":"border-[#C59B27]/40"}"><div class="flex justify-between text-xs font-bold"><span class="px-2 py-0.5 bg-[#C59B27] rounded">VIP ${m.vipLevel}</span><span>${esc(m.memberId)}</span></div><div class="text-xs text-[#5C544B] mt-1 tabular-nums">โทร: ${fmtPhone(m.phone)}</div><div class="text-xs font-bold mt-1 tabular-nums">เงิน: ${fmtBaht(m.totalBalanceBaht)} ฿</div></button>`).join("")}</div>  
        </section>  
        ${st.adminMsg?`<div class="card-gold p-3 text-sm">${esc(st.adminMsg)}</div>`:""}  
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">  
          <section class="lg:col-span-6 card p-4 space-y-4">  
            <div class="flex justify-between border-b border-[#C59B27]/25 pb-3"><div><h2 class="font-editorial text-lg font-bold">จัดการฝาก / ถอน และปรับยอด</h2><p class="text-xs text-[#5C544B]">${esc(sel.memberId)} (${fmtPhone(sel.phone)})</p></div><div class="text-right"><span class="text-xs text-[#5C544B] block">เงินทั้งหมด</span><b class="font-editorial text-lg text-[#8C6A10] tabular-nums">${fmtBaht(sel.totalBalanceBaht)} บาท</b></div></div>  
            <div class="bg-[#FAF8F5] border border-[#C59B27]/40 rounded-lg p-3 space-y-2.5 text-sm">  
              <div class="grid grid-cols-2 gap-2"><input id="inp-adm-amt" type="text" inputmode="numeric" value="10000" class="inp !bg-[#FFF] tabular-nums"/><input id="inp-adm-note" type="text" placeholder="หมายเหตุ" class="inp !bg-[#FFF]"/></div>  
              <div class="grid grid-cols-2 gap-2"><button id="btn-adm-add" class="btn-gold py-2">+ เพิ่มยอดเงิน</button><button id="btn-adm-sub" class="btn-out py-2">- หักยอดเงิน</button></div>  
            </div>  
            <div class="space-y-2">  
              <div class="flex justify-between items-center text-xs"><b class="text-sm">รายการฝาก / ถอน</b><div class="flex gap-1"><button data-adm-txf="all" class="px-2 py-1 rounded font-semibold cursor-pointer ${st.adminTxFilter==="all"?"bg-[#C59B27]":"bg-[#FAF8F5]"}">ทั้งหมด</button><button data-adm-txf="pending" class="px-2 py-1 rounded font-semibold cursor-pointer ${st.adminTxFilter==="pending"?"bg-[#C59B27]":"bg-[#FAF8F5]"}">รออนุมัติ</button></div></div>  
              <div class="divide-y divide-[#C59B27]/25 border border-[#C59B27]/40 rounded-lg max-h-[320px] overflow-y-auto">${txs.length===0?`<p class="p-4 text-center text-xs text-[#5C544B]">ไม่มีรายการ</p>`:txs.map(t=>`<div class="p-3 flex justify-between items-center gap-2 text-xs"><div><div class="font-semibold">${esc(t.title)}</div><div class="text-[#5C544B]">${fmtTime(t.timestamp)} · <b>${esc(t.status)}</b></div></div><div class="flex items-center gap-2 shrink-0"><b class="tabular-nums">${t.amountBaht>=0?"+":""}${fmtBaht(t.amountBaht)} ฿</b>${t.status==="รออนุมัติ"?`<button data-tx-app="${t.id}" class="btn-gold px-2 py-1">อนุมัติ</button><button data-tx-rej="${t.id}" class="px-2 py-1 border border-red-300 text-red-800 font-bold rounded cursor-pointer">ปฏิเสธ</button>`:""}</div></div>`).join("")}</div>  
            </div>  
          </section>  
          <section class="lg:col-span-6 card p-4 space-y-4">  
            <h2 class="font-editorial text-lg font-bold border-b border-[#C59B27]/25 pb-3">ล็อก / ปลดล็อกรูปภาพประมูล</h2>  
            <div class="grid grid-cols-5 gap-2">${AUCTION_LEVELS.map(l=>`<button data-adm-lv="${l.level}" class="p-2 rounded-lg border text-center cursor-pointer ${l.level===st.adminLevel?"bg-[#FAF8F5] border-[#C59B27]":"border-[#C59B27]/35"}"><div class="text-xs font-bold">LV.${l.level}</div><div class="text-[11px] text-[#8C6A10]">${sel.lockedLevels.includes(l.level)?"ล็อกอยู่":"ปกติ"}</div></button>`).join("")}</div>  
            <div class="bg-[#FAF8F5] border border-[#C59B27]/50 rounded-lg p-3 flex justify-between items-center gap-2 text-xs"><div><b>ควบคุมทั้งเลเวล ${st.adminLevel}</b><div class="text-[#5C544B]">${isLvLk?"ล็อกทั้งเลเวลอยู่":"เปิดให้ประมูลปกติ"}</div></div><button id="btn-adm-lock-lv" class="px-3.5 py-2 ${isLvLk?"btn-out":"btn-gold"}">${isLvLk?`ปลดล็อกทั้งเลเวล ${st.adminLevel}`:`ล็อกทั้งเลเวล ${st.adminLevel}`}</button></div>  
            <div class="space-y-2.5">${lvlItems.map(it=>{const sk=slotKey(it.level,it.slotIndex), il=sel.lockedItemIds.includes(sk); return `<div class="p-3 rounded-lg border border-[#C59B27]/40 flex justify-between items-center gap-3 text-xs"><div class="min-w-0"><div class="font-bold truncate">${esc(it.titleTh)}</div><div class="text-[#5C544B] tabular-nums">ราคา ${fmtBaht(it.priceBaht)} ฿ · คอม ${fmtBaht(it.commissionBaht)} ฿</div></div><button data-adm-lock-item="${sk}" class="px-3 py-1.5 shrink-0 ${il?"btn-out":"btn-gold"}">${il?"ปลดล็อกภาพ":"ล็อกภาพนี้"}</button></div>`;}).join("")}</div>  
          </section>  
        </div>  
      </div></main>`;  
    }  
  
    function bindEvents() {  
      const $ = id => document.getElementById(id);  
      document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => { st.view = el.dataset.nav; st.panelErr = null; persist(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });  
      if ($("btn-top-login")) $("btn-top-login").onclick = () => { st.authMode = "login"; st.view = "auth"; st.panelErr = null; render(); };  
      const logout = () => { st.currentUser = null; st.view = "auth"; st.authMode = "login"; persist(); toast("ออกจากระบบเรียบร้อยแล้ว"); };  
      if ($("btn-top-logout")) $("btn-top-logout").onclick = logout;  
      if ($("btn-logout-account")) $("btn-logout-account").onclick = logout;  
      if ($("btn-secret-admin")) $("btn-secret-admin").onclick = () => {  
        const n = Date.now(); if (n - st.lastTapAt > 2500) st.tapCount = 0;  
        st.lastTapAt = n; st.tapCount += 1;  
        if (st.tapCount >= 5) { st.tapCount = 0; st.view = "admin"; st.panelErr = null; render(); }  
      };  
  
      if ($("slider-viewport")) $("slider-viewport").onpointerdown = () => { st.sliderHold = true; sliderUi(); };  
      if ($("btn-slide-toggle")) $("btn-slide-toggle").onclick = () => { st.sliderPaused = !st.sliderPaused; sliderUi(); };  
      if ($("btn-slide-prev")) $("btn-slide-prev").onclick = () => { st.sliderOffset = Math.max(0, st.sliderOffset - 260); if ($("slider-track")) $("slider-track").style.transform = `translate3d(-${st.sliderOffset.toFixed(2)}px,0,0)`; };  
      if ($("btn-slide-next")) $("btn-slide-next").onclick = () => { st.sliderOffset += 260; if ($("slider-track")) $("slider-track").style.transform = `translate3d(-${st.sliderOffset.toFixed(2)}px,0,0)`; };  
      document.querySelectorAll("[data-select-art]").forEach(el => el.onclick = () => { st.selectedArtworkId = el.dataset.selectArt; render(); if (el.dataset.scrollLedger) $("artwork-ledger")?.scrollIntoView({ behavior: "smooth" }); });  
      document.querySelectorAll("[data-home-filter]").forEach(el => el.onclick = () => { st.homeFilter = el.dataset.homeFilter; render(); });  
  
      document.querySelectorAll("[data-open-level]").forEach(el => el.onclick = () => { st.auctionModalLevel = Number(el.dataset.openLevel); st.auctionSlideIdx = 0; render(); });  
      if ($("auction-modal-bg")) $("auction-modal-bg").onclick = () => { st.auctionModalLevel = null; render(); };  
      if ($("btn-close-auction-modal")) $("btn-close-auction-modal").onclick = () => { st.auctionModalLevel = null; render(); };  
      document.querySelectorAll("[data-slide-idx]").forEach(el => el.onclick = () => { st.auctionSlideIdx = Number(el.dataset.slideIdx); render(); });  
      document.querySelectorAll("[data-slide-step]").forEach(el => el.onclick = () => { st.auctionSlideIdx = Math.max(0, Math.min(2, st.auctionSlideIdx + Number(el.dataset.slideStep))); render(); });  
      if ($("btn-place-bid")) $("btn-place-bid").onclick = () => {  
        const ws = activeWs(), item = st.auctionItems.find(i => i.id === $("btn-place-bid").dataset.bidId); if (!item) return;  
        const now = Date.now();  
        ws.totalBalanceBaht -= item.priceBaht; ws.transactionBalanceBaht += item.priceBaht; ws.vipLevel = Math.max(ws.vipLevel, item.level);  
        ws.activeBid = { item, startedAt: now, endsAt: now + item.durationMinutes * 60000 }; ws.lastSettledItem = null;  
        ws.txHistory.unshift({ id: `tx-bid-${now}`, type: "bid", title: `ประมูลภาพ: ${item.titleTh} (เลเวล ${item.level})`, amountBaht: -item.priceBaht, timestamp: new Date(now).toISOString(), status: "ย้ายเข้าธุรกรรม" });  
        st.auctionModalLevel = null; st.view = "timer"; persist(); toast(`กดประมูล "${item.titleTh}" แล้ว`);  
      };  
  
      document.querySelectorAll("[data-open-panel]").forEach(el => el.onclick = () => { st.accountPanel = el.dataset.openPanel; st.panelErr = null; st.panelOk = null; render(); });  
      if ($("acc-modal-bg")) $("acc-modal-bg").onclick = () => { st.accountPanel = "none"; render(); };  
      if ($("btn-close-acc-modal")) $("btn-close-acc-modal").onclick = () => { st.accountPanel = "none"; render(); };  
      if ($("form-topup")) $("form-topup").onsubmit = e => { e.preventDefault(); const amt = parseInt($("inp-topup").value.replace(/\D/g,""),10); if (!amt || amt < 100) { st.panelErr = "ขั้นต่ำ 100 บาท"; render(); return; } activeWs().txHistory.unshift({ id: `tx-dep-${Date.now()}`, type: "topup", title: "คำขอเติมเงินเข้าบัญชี", amountBaht: amt, timestamp: new Date().toISOString(), status: "รออนุมัติ" }); st.panelOk = `ส่งคำขอเติมเงิน ${fmtBaht(amt)} บาทแล้ว (รออนุมัติจากหลังบ้าน)`; persist(); render(); };  
      if ($("form-withdraw")) $("form-withdraw").onsubmit = e => { e.preventDefault(); const ws = activeWs(), amt = parseInt($("inp-wd-amt").value.replace(/\D/g,""),10), pin = $("inp-wd-pin").value; if (!ws.bankAccount) st.panelErr = "กรุณาผูกบัญชีธนาคารก่อน"; else if (!ws.withdrawalPin) st.panelErr = "กรุณาตั้งค่ารหัสถอน 6 หลักก่อน"; else if (pin !== ws.withdrawalPin) st.panelErr = "รหัสถอน 6 หลักไม่ถูกต้อง"; else if (!amt || amt < 100 || amt > ws.totalBalanceBaht) st.panelErr = "จำนวนเงินถอนไม่ถูกต้องหรือไม่เพียงพอ"; else { ws.totalBalanceBaht -= amt; ws.txHistory.unshift({ id: `tx-wd-${Date.now()}`, type: "withdraw", title: `คำขอถอนเงินเข้า ${ws.bankAccount.bankName}`, amountBaht: -amt, timestamp: new Date().toISOString(), status: "รออนุมัติ" }); st.panelOk = `ส่งคำขอถอนเงิน ${fmtBaht(amt)} บาทแล้ว`; persist(); } render(); };  
      if ($("form-pin")) $("form-pin").onsubmit = e => { e.preventDefault(); const p1 = $("inp-pin-1").value, p2 = $("inp-pin-2").value; if (!/^\d{6}$/.test(p1)) st.panelErr = "รหัสถอนต้องเป็นตัวเลข 6 หลัก"; else if (p1 !== p2) st.panelErr = "ยืนยันรหัสถอนไม่ตรงกัน"; else { activeWs().withdrawalPin = p1; st.panelOk = "ตั้งรหัสถอน 6 หลักเรียบร้อยแล้ว"; persist(); } render(); };  
      if ($("form-bank")) $("form-bank").onsubmit = e => { e.preventDefault(); const bn = $("inp-bank-name").value, bh = $("inp-bank-holder").value.trim(), num = $("inp-bank-num").value.replace(/\D/g,""); if (!bh || num.length < 10 || num.length > 12) st.panelErr = "กรุณากรอกชื่อบัญชีและเลขบัญชี 10–12 หลัก"; else { activeWs().bankAccount = { bankName: bn, accountHolder: bh, accountNumber: num, boundAt: new Date().toISOString() }; st.panelOk = "ผูกบัญชีธนาคารเรียบร้อยแล้ว"; persist(); } render(); };  
  
      document.querySelectorAll("[data-auth-tab]").forEach(el => el.onclick = () => { st.authMode = el.dataset.authTab; st.panelErr = null; render(); });  
      if ($("btn-fill-demo")) $("btn-fill-demo").onclick = () => { $("auth-phone").value = "0812345678"; $("auth-pass").value = "123456"; };  
      if ($("auth-form")) $("auth-form").onsubmit = e => {  
        e.preventDefault(); const ph = $("auth-phone").value.replace(/\D/g,""), pw = $("auth-pass").value.replace(/\D/g,"");  
        if (!/^0\d{8,9}$/.test(ph)) { st.panelErr = "เบอร์โทรไม่ถูกต้อง"; render(); return; }  
        if (pw.length < 6 || pw.length > 8) { st.panelErr = "รหัสผ่านต้องเป็นตัวเลข 6–8 หลัก"; render(); return; }  
        if (st.authMode === "register") {  
          if (pw !== $("auth-confirm").value.replace(/\D/g,"")) { st.panelErr = "รหัสผ่านไม่ตรงกัน"; render(); return; }  
          if (st.users.some(u => u.phone === ph)) { st.panelErr = "เบอร์นี้สมัครไว้แล้ว"; render(); return; }  
          const u = { phone: ph, password: pw, createdAt: new Date().toISOString() };  
          st.users.push(u); st.currentUser = u; st.previewPhone = ph; st.adminSelectedPhone = ph;  
          st.workspaces[ph] ||= emptyWs(ph); st.view = "home"; persist(); toast(`สมัครสมาชิกสำเร็จ (${fmtPhone(ph)})`);  
        } else {  
          const u = st.users.find(x => x.phone === ph && x.password === pw);  
          if (!u) { st.panelErr = "เบอร์โทรศัพท์หรือรหัสผ่านไม่ถูกต้อง"; render(); return; }  
          st.currentUser = u; st.previewPhone = ph; st.adminSelectedPhone = ph; st.view = "home"; persist(); toast(`เข้าสู่ระบบสำเร็จ (${fmtPhone(ph)})`);  
        }  
      };  
  
      if ($("admin-gate-form")) $("admin-gate-form").onsubmit = e => { e.preventDefault(); if ($("admin-pass-input").value === ADMIN_PASSCODE) { st.adminUnlocked = true; st.panelErr = null; render(); } else { st.panelErr = "รหัสผ่านไม่ถูกต้อง"; render(); } };  
      if ($("inp-adm-search")) {  
        if (st._focusSearch) { st._focusSearch = false; $("inp-adm-search").focus(); $("inp-adm-search").setSelectionRange(st.adminSearch.length, st.adminSearch.length); }  
        $("inp-adm-search").oninput = e => { st.adminSearch = e.target.value; st._focusSearch = true; render(); };  
      }  
      document.querySelectorAll("[data-adm-sel]").forEach(el => el.onclick = () => { st.adminSelectedPhone = el.dataset.admSel; st.adminMsg = null; render(); });  
      if ($("btn-adm-switch")) $("btn-adm-switch").onclick = () => { const s = st.workspaces[st.adminSelectedPhone]; if (s) { st.previewPhone = s.phone; st.currentUser = { phone: s.phone, password: "******", createdAt: new Date().toISOString() }; persist(); toast(`สลับมุมมองเป็น ${s.memberId}`); } };  
      if ($("btn-adm-lock")) $("btn-adm-lock").onclick = () => { st.adminUnlocked = false; st.view = "home"; render(); };  
      const adj = dir => { const s = st.workspaces[st.adminSelectedPhone], amt = parseInt($("inp-adm-amt").value.replace(/\D/g,""),10), note = $("inp-adm-note").value.trim() || (dir>0?"แอดมินปรับเพิ่มยอดเงิน":"แอดมินปรับลดยอดเงิน"); if (!amt || s.totalBalanceBaht + dir*amt < 0) { st.adminMsg = "จำนวนเงินไม่ถูกต้อง"; render(); return; } s.totalBalanceBaht += dir*amt; s.txHistory.unshift({ id: `tx-adj-${Date.now()}`, type: dir>0?"topup":"withdraw", title: note, amountBaht: dir*amt, timestamp: new Date().toISOString(), status: "อนุมัติแล้ว" }); st.adminMsg = `ปรับยอด ${fmtBaht(amt)} บาท เรียบร้อย`; persist(); render(); };  
      if ($("btn-adm-add")) $("btn-adm-add").onclick = () => adj(1);  
      if ($("btn-adm-sub")) $("btn-adm-sub").onclick = () => adj(-1);  
      document.querySelectorAll("[data-adm-txf]").forEach(el => el.onclick = () => { st.adminTxFilter = el.dataset.admTxf; render(); });  
      document.querySelectorAll("[data-tx-app]").forEach(el => el.onclick = () => { const s = st.workspaces[st.adminSelectedPhone], tx = s.txHistory.find(t => t.id === el.dataset.txApp); if (tx && tx.status === "รออนุมัติ") { if (tx.type === "topup" && tx.amountBaht > 0) s.totalBalanceBaht += tx.amountBaht; tx.status = "อนุมัติแล้ว"; st.adminMsg = "อนุมัติรายการแล้ว"; persist(); render(); } });  
      document.querySelectorAll("[data-tx-rej]").forEach(el => el.onclick = () => { const s = st.workspaces[st.adminSelectedPhone], tx = s.txHistory.find(t => t.id === el.dataset.txRej); if (tx && tx.status === "รออนุมัติ") { if (tx.type === "withdraw" && tx.amountBaht < 0) s.totalBalanceBaht += Math.abs(tx.amountBaht); tx.status = tx.type === "withdraw" ? "ปฏิเสธ (คืนยอดแล้ว)" : "ปฏิเสธ"; st.adminMsg = "ปฏิเสธรายการแล้ว"; persist(); render(); } });  
      document.querySelectorAll("[data-adm-lv]").forEach(el => el.onclick = () => { st.adminLevel = Number(el.dataset.admLv); render(); });  
      if ($("btn-adm-lock-lv")) $("btn-adm-lock-lv").onclick = () => { const s = st.workspaces[st.adminSelectedPhone], i = s.lockedLevels.indexOf(st.adminLevel); if (i>=0) s.lockedLevels.splice(i,1); else s.lockedLevels.push(st.adminLevel); persist(); render(); };  
      document.querySelectorAll("[data-adm-lock-item]").forEach(el => el.onclick = () => { const s = st.workspaces[st.adminSelectedPhone], k = el.dataset.admLockItem, i = s.lockedItemIds.indexOf(k); if (i>=0) s.lockedItemIds.splice(i,1); else s.lockedItemIds.push(k); persist(); render(); });  
    }  
  
    render();  
  })();  
  </script>  
</body>  
</html>
