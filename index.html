                </div>
              </section>

              <section class="bg-white border border-[#C59B27]/50 rounded-xl p-4 space-y-2 text-sm">
                <a href="${LINE_URL}" target="_blank" rel="noopener noreferrer" class="flex justify-between items-center p-2.5 bg-[#FAF8F5] rounded-lg border border-[#C59B27]/30">
                  <span class="font-semibold">ศูนย์ช่วยเหลือ (LINE ฝ่ายบริการ)</span><span class="text-xs text-[#8C6A10]">เปิด LINE &rarr;</span>
                </a>
                <button onclick="setAccPanel('pin')" class="w-full flex justify-between items-center p-2.5 bg-[#FAF8F5] rounded-lg border border-[#C59B27]/30 text-left">
                  <span class="font-semibold">รหัสถอน (6 ตัวเลข)</span><span class="text-xs text-[#5C544B]">${ws.withdrawalPin ? 'ตั้งค่าแล้ว (เปลี่ยนเองไม่ได้)' : 'กดเพื่อตั้งค่า'}</span>
                </button>
                <button onclick="setAccPanel('bank')" class="w-full flex justify-between items-center p-2.5 bg-[#FAF8F5] rounded-lg border border-[#C59B27]/30 text-left">
                  <span class="font-semibold">บัญชีธนาคารรับเงิน</span><span class="text-xs text-[#5C544B]">${ws.bankAccount ? ws.bankAccount.bankName + ' · ' + maskBank(ws.bankAccount.accountNumber) : 'กดเพื่อผูกบัญชี'}</span>
                </button>
                <button onclick="setAccPanel('history')" class="w-full flex justify-between items-center p-2.5 bg-[#FAF8F5] rounded-lg border border-[#C59B27]/30 text-left">
                  <span class="font-semibold">ประวัติธุรกรรม</span><span class="text-xs text-[#8C6A10]">${ws.txHistory.length} รายการ</span>
                </button>
              </section>

              ${renderAccountSubPanel(ws)}
            </main>`;
        } else if (activeView === 'auth') {
          mainHtml = `
            <main class="flex-1 max-w-md mx-auto w-full px-4 py-8">
              <div class="bg-white border-2 border-[#C59B27] rounded-2xl p-6 space-y-4 shadow-sm">
                <div class="flex gap-2">
                  <button onclick="openAuth('login')" class="flex-1 py-2 rounded-lg text-xs font-bold ${authMode === 'login' ? 'bg-[#C59B27]' : 'bg-[#FAF8F5] border'}">เข้าสู่ระบบ</button>
                  <button onclick="openAuth('register')" class="flex-1 py-2 rounded-lg text-xs font-bold ${authMode === 'register' ? 'bg-[#C59B27]' : 'bg-[#FAF8F5] border'}">สมัครสมาชิก</button>
                </div>
                <form onsubmit="submitAuth(event)" class="space-y-3 text-xs">
                  <div><label class="block font-semibold mb-1">เบอร์โทรศัพท์</label><input id="auth-phone" required placeholder="08XXXXXXXX" class="w-full p-2.5 bg-[#FAF8F5] border border-[#C59B27]/60 rounded-lg" /></div>
                  <div><label class="block font-semibold mb-1">รหัสผ่าน (ตัวเลข 6-8 หลัก)</label><input id="auth-pass" type="password" required minlength="6" maxlength="8" class="w-full p-2.5 bg-[#FAF8F5] border border-[#C59B27]/60 rounded-lg" /></div>
                  ${authMode === 'register' ? `<div><label class="block font-semibold mb-1">ยืนยันรหัสผ่าน</label><input id="auth-confirm" type="password" required minlength="6" maxlength="8" class="w-full p-2.5 bg-[#FAF8F5] border border-[#C59B27]/60 rounded-lg" /></div>` : ''}
                  <button type="submit" class="w-full py-2.5 bg-[#C59B27] font-bold text-sm rounded-lg">${authMode === 'register' ? 'ยืนยันสมัครสมาชิก (เริ่มต้น 0 บาท)' : 'เข้าสู่ระบบ'}</button>
                </form>
              </div>
            </main>`;
        } else if (activeView === 'admin') {
          if (!adminUnlocked) {
            mainHtml = `
              <main class="flex-1 flex items-center justify-center p-4">
                <form onsubmit="unlockAdmin(event)" class="w-full max-w-sm bg-white border-2 border-[#C59B27] rounded-2xl p-6 space-y-4 text-center">
                  <h1 class="font-editorial text-xl font-bold">เข้าสู่ระบบหลังบ้าน</h1>
                  <input id="admin-pin" type="password" maxlength="6" placeholder="••••••" class="w-full p-2.5 text-center font-bold tracking-widest bg-[#FAF8F5] border border-[#C59B27] rounded-lg" />
                  <button type="submit" class="w-full py-2.5 bg-[#C59B27] font-bold text-sm rounded-lg">ยืนยันรหัสผ่านหลังบ้าน</button>
                </form>
              </main>`;
          } else {
            const sel = workspaces[adminSelectedPhone] || Object.values(workspaces)[0];
            const unread = alerts.filter((a) => !a.readByAdmin).length;
            mainHtml = `
              <main class="flex-1 max-w-5xl mx-auto w-full px-3 sm:px-6 py-4 space-y-4 text-xs">
                <div class="bg-white border border-[#C59B27] rounded-xl p-4 flex justify-between items-center">
                  <h1 class="font-editorial text-lg font-bold">ระบบหลังบ้าน · จัดการสมาชิกและยอดเงิน</h1>
                  <button onclick="lockAdmin()" class="px-3 py-1.5 bg-[#FAF8F5] border border-[#C59B27] rounded font-semibold">ออกหลังบ้าน</button>
                </div>
                <div class="bg-white border border-[#C59B27] rounded-xl p-4 space-y-2">
                  <div class="flex justify-between items-center">
                    <b class="text-sm">แจ้งเตือนผู้สมัครใหม่สำหรับ "อ๊อฟ" (${unread} รายการใหม่)</b>
                    <button onclick="markAlertsRead()" class="text-[#8C6A10] underline">รับทราบทั้งหมด</button>
                  </div>
                  ${alerts.length === 0 ? '<p class="text-[#5C544B]">ยังไม่มีผู้สมัครใหม่</p>' : alerts.slice(0, 8).map((a) => `
                    <div class="flex justify-between items-center p-2 rounded ${a.readByAdmin ? 'bg-[#FAF8F5]' : 'bg-amber-50 border border-[#C59B27]'}">
                      <span>${a.memberId} · โทร ${a.phone}</span>
                      <button onclick="selectAdminMember('${a.phone}')" class="px-2 py-1 bg-[#C59B27] rounded font-bold">จัดการ/เติมเงิน</button>
                    </div>
                  `).join('')}
                </div>
                <div class="bg-white border border-[#C59B27] rounded-xl p-4 space-y-3">
                  <div class="flex flex-wrap gap-2">
                    ${Object.values(workspaces).map((m) => `<button onclick="selectAdminMember('${m.phone}')" class="px-2.5 py-1 rounded border ${sel.phone === m.phone ? 'bg-[#C59B27] font-bold' : 'bg-[#FAF8F5]'}">${m.memberId} (${m.phone}) · ${fmt(m.totalBalanceBaht)} ฿</button>`).join('')}
                  </div>
                  <div class="p-3 bg-[#FAF8F5] rounded-lg space-y-2">
                    <div>สมาชิกที่เลือก: <b>${sel.memberId} (${sel.phone})</b> | ยอดเงินปัจจุบัน: <b class="text-[#8C6A10]">${fmt(sel.totalBalanceBaht)} บาท</b></div>
                    <div class="flex gap-2">
                      <input id="adj-amt" type="number" value="10000" class="flex-1 p-2 bg-white border border-[#C59B27]/60 rounded" />
                      <button onclick="adminAdjust(1)" class="px-3 py-2 bg-[#C59B27] font-bold rounded">+ เพิ่มยอด</button>
                      <button onclick="adminAdjust(-1)" class="px-3 py-2 bg-white border border-red-400 text-red-700 font-bold rounded">- หักยอด</button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-2">
                      ${[1, 2, 3, 4, 5].map((lv) => {
                        const lk = sel.lockedLevels.includes(lv);
                        return `<button onclick="toggleLvlLock('${sel.phone}', ${lv})" class="px-2.5 py-1 rounded border ${lk ? 'bg-red-50 border-red-400 text-red-700' : 'bg-white border-[#C59B27]/40'}">${lk ? 'ปลดล็อก' : 'ล็อก'} เลเวล ${lv}</button>`;
                      }).join('')}
                    </div>
                  </div>
                </div>
              </main>`;
          }
        }

        document.getElementById('app').innerHTML = `
          <header class="sticky top-0 z-40 bg-[#FAF8F5]/95 border-b border-[#C59B27]/35">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 h-12 grid grid-cols-3 items-center">
              <button onclick="setView('home')" class="text-left font-editorial text-sm sm:text-base font-bold truncate">หอศิลป์สุวรรณวิจิตร</button>
              <button onclick="handleCenterTap()" class="font-editorial text-base font-bold text-center select-none">${titleMap[activeView] || 'หน้าแรก'}</button>
              <div class="text-right">
                ${currentUser
                  ? `<button onclick="logout()" class="px-2.5 py-1 text-xs font-semibold bg-white border border-[#C59B27] rounded">ออกระบบ</button>`
                  : `<button onclick="openAuth('login')" class="px-2.5 py-1 text-xs font-bold bg-[#C59B27] rounded">เข้าสู่ระบบ</button>`}
              </div>
            </div>
          </header>
          ${toast ? `<div class="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-emerald-50 border-2 border-emerald-600 text-emerald-950 px-4 py-2 rounded-xl text-xs font-bold shadow">${toast}</div>` : ''}
          ${mainHtml}
          <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 border-t border-[#C59B27]/45">
            <div class="max-w-3xl mx-auto grid grid-cols-4 h-14 text-[11px]">
              ${[['home', 'หน้าแรก'], ['auction', 'ประมูล'], ['timer', hasBid ? 'เวลา (กำลังนับ)' : 'เวลา'], ['account', 'บัญชี']].map(([v, lb]) => `
                <button onclick="setView('${v}')" class="flex items-center justify-center border-t-2 ${activeView === v ? 'bg-[#FAF8F5] border-[#C59B27] font-bold' : 'border-transparent text-[#5C544B]'}">${lb}</button>
              `).join('')}
            </div>
          </nav>`;
      }

      function renderAccountSubPanel(ws) {
        if (accountPanel === 'none') return '';
        let body = '';
        if (accountPanel === 'topup') {
          body = `<form onsubmit="submitTopup(event)" class="space-y-2"><input id="dep-amt" type="number" min="100" required placeholder="จำนวนเงินเติม (บาท)" class="w-full p-2 border rounded" /><button class="w-full py-2 bg-[#C59B27] font-bold rounded">ส่งคำขอเติมเงิน</button></form>`;
        } else if (accountPanel === 'withdraw') {
          body = `<form onsubmit="submitWithdraw(event)" class="space-y-2"><input id="wd-amt" type="number" min="100" required placeholder="จำนวนเงินถอน" class="w-full p-2 border rounded" /><input id="wd-pin" type="password" maxlength="6" required placeholder="รหัสถอน 6 หลัก" class="w-full p-2 border rounded" /><button class="w-full py-2 bg-[#C59B27] font-bold rounded">ส่งคำขอถอนเงิน</button></form>`;
        } else if (accountPanel === 'pin') {
          body = ws.withdrawalPin ? `<p class="text-xs text-[#5C544B]">ตั้งค่าแล้ว หากต้องการเปลี่ยนกรุณาติดต่อฝ่ายบริการ</p>` : `<form onsubmit="submitPin(event)" class="space-y-2"><input id="new-pin" maxlength="6" required placeholder="ตั้งรหัสถอน 6 หลัก" class="w-full p-2 border rounded" /><button class="w-full py-2 bg-[#C59B27] font-bold rounded">บันทึกรหัสถอน</button></form>`;
        } else if (accountPanel === 'bank') {
          body = ws.bankAccount ? `<p class="text-xs">${ws.bankAccount.bankName} · ${ws.bankAccount.accountHolder} · ${maskBank(ws.bankAccount.accountNumber)}</p>` : `<form onsubmit="submitBank(event)" class="space-y-2"><select id="bk-name" class="w-full p-2 border rounded">${BANK_LIST.map((b) => `<option>${b}</option>`).join('')}</select><input id="bk-holder" required placeholder="ชื่อบัญชี" class="w-full p-2 border rounded" /><input id="bk-num" required minlength="10" maxlength="12" placeholder="เลขบัญชี 10-12 หลัก" class="w-full p-2 border rounded" /><button class="w-full py-2 bg-[#C59B27] font-bold rounded">ผูกบัญชีธนาคาร</button></form>`;
        } else if (accountPanel === 'history') {
          body = ws.txHistory.length === 0 ? '<p class="text-xs text-[#5C544B]">ยังไม่มีรายการธุรกรรม</p>' : ws.txHistory.slice(0, 15).map((t) => `<div class="flex justify-between py-1.5 border-b text-xs"><span>${t.title} (${t.status})</span><b>${fmt(t.amountBaht)} ฿</b></div>`).join('');
        }
        return `<section class="bg-white border border-[#C59B27] rounded-xl p-4 space-y-2 text-xs"><div class="flex justify-between font-bold"><span>จัดการบัญชี</span><button onclick="setAccPanel('none')">ปิด</button></div>${body}</section>`;
      }

      window.selectArt = (id) => { selectedArt = ARTWORKS.find((a) => a.id === id) || ARTWORKS[0]; render(); };
      window.setOriginFilter = (f) => { filterOrigin = f; render(); };
      window.togglePause = (p) => { sliderPaused = p; render(); };
      window.openLvlModal = (lv) => { openLevel = lv; slideIdx = 0; render(); };
      window.closeLvlModal = () => { openLevel = null; render(); };
      window.stepSlide = (d) => { slideIdx = Math.max(0, Math.min(2, slideIdx + d)); render(); };
      window.setAccPanel = (p) => { accountPanel = p; sessionStorage.setItem(KEYS.TAB_PANEL, p); render(); };
      window.openAuth = (m) => { authMode = m; setView('auth'); };
      window.logout = () => { currentUser = null; localStorage.removeItem(KEYS.SESSION); setView('home'); setToast('ออกจากระบบเรียบร้อย'); };
      window.handleCenterTap = () => {
        const now = Date.now();
        if (now - lastTap > 2500) tapCount = 0;
        lastTap = now;
        if (++tapCount >= 5) { tapCount = 0; setView('admin'); }
      };

      window.submitAuth = (e) => {
        e.preventDefault();
        const phone = document.getElementById('auth-phone').value.replace(/\D/g, '');
        const pass = document.getElementById('auth-pass').value;
        if (authMode === 'register') {
          const conf = document.getElementById('auth-confirm').value;
          if (pass !== conf) return setToast('ยืนยันรหัสผ่านไม่ตรงกัน');
          if (users.some((u) => u.phone === phone)) return setToast('เบอร์นี้สมัครสมาชิกไว้แล้ว');
          const u = { phone, password: pass, createdAt: new Date().toISOString() };
          users.push(u);
          workspaces[phone] = newWorkspace(phone);
          alerts.unshift({ id: 'al-' + Date.now(), phone, memberId: deriveId(phone), readByAdmin: false });
          writeLS(KEYS.USERS, users);
          writeLS(KEYS.WORKSPACES, workspaces);
          writeLS(KEYS.ALERTS, alerts);
          currentUser = u;
          writeLS(KEYS.SESSION, u);
          setView('home');
          setToast('สมัครสมาชิกสำเร็จ (ยอดเริ่มต้น 0 บาท)');
        } else {
          const u = users.find((x) => x.phone === phone && x.password === pass);
          if (!u) return setToast('เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง');
          if (!workspaces[phone]) workspaces[phone] = newWorkspace(phone);
          currentUser = u;
          writeLS(KEYS.SESSION, u);
          writeLS(KEYS.WORKSPACES, workspaces);
          setView('home');
          setToast('เข้าสู่ระบบสำเร็จ');
        }
      };

      window.placeBid = (id) => {
        if (!currentUser) return setToast('กรุณาเข้าสู่ระบบก่อนกดประมูล');
        const ws = workspaces[currentUser.phone];
        const item = auctions.find((i) => i.id === id);
        if (!item || ws.totalBalanceBaht < item.priceBaht) return setToast('ยอดเงินทั้งหมดไม่เพียงพอ');
        const now = Date.now();
        ws.totalBalanceBaht -= item.priceBaht;
        ws.transactionBalanceBaht += item.priceBaht;
        ws.vipLevel = Math.max(ws.vipLevel, item.level);
        ws.activeBid = { item, startedAt: now, endsAt: now + item.durationMinutes * 60000 };
        ws.txHistory.unshift({ id: 'tx-' + now, title: 'ประมูล: ' + item.titleTh, amountBaht: -item.priceBaht, status: 'ย้ายเข้าธุรกรรม' });
        writeLS(KEYS.WORKSPACES, workspaces);
        openLevel = null;
        setView('timer');
      };

      window.submitTopup = (e) => {
        e.preventDefault();
        if (!currentUser) return setToast('กรุณาเข้าสู่ระบบก่อน');
        const amt = Number(document.getElementById('dep-amt').value);
        workspaces[currentUser.phone].txHistory.unshift({ id: 'tx-' + Date.now(), title: 'คำขอเติมเงิน', amountBaht: amt, status: 'รออนุมัติ' });
        writeLS(KEYS.WORKSPACES, workspaces);
        setAccPanel('none');
        setToast('ส่งคำขอเติมเงินเรียบร้อย');
      };

      window.submitWithdraw = (e) => {
        e.preventDefault();
        if (!currentUser) return setToast('กรุณาเข้าสู่ระบบก่อน');
        const ws = workspaces[currentUser.phone];
        const amt = Number(document.getElementById('wd-amt').value);
        const pin = document.getElementById('wd-pin').value;
        if (!ws.bankAccount || !ws.withdrawalPin) return setToast('กรุณาผูกบัญชีและตั้งรหัสถอนก่อน');
        if (pin !== ws.withdrawalPin) return setToast('รหัสถอนไม่ถูกต้อง');
        if (amt > ws.totalBalanceBaht) return setToast('ยอดเงินไม่เพียงพอ');
        ws.totalBalanceBaht -= amt;
        ws.txHistory.unshift({ id: 'tx-' + Date.now(), title: 'คำขอถอนเงิน', amountBaht: -amt, status: 'รออนุมัติ' });
        writeLS(KEYS.WORKSPACES, workspaces);
        setAccPanel('none');
        setToast('ส่งคำขอถอนเงินเรียบร้อย');
      };

      window.submitPin = (e) => {
        e.preventDefault();
        if (!currentUser) return setToast('กรุณาเข้าสู่ระบบก่อน');
        workspaces[currentUser.phone].withdrawalPin = document.getElementById('new-pin').value;
        writeLS(KEYS.WORKSPACES, workspaces);
        setAccPanel('none');
        setToast('บันทึกรหัสถอน 6 หลักเรียบร้อย');
      };

      window.submitBank = (e) => {
        e.preventDefault();
        if (!currentUser) return setToast('กรุณาเข้าสู่ระบบก่อน');
        workspaces[currentUser.phone].bankAccount = {
          bankName: document.getElementById('bk-name').value,
          accountHolder: document.getElementById('bk-holder').value,
          accountNumber: document.getElementById('bk-num').value,
        };
        writeLS(KEYS.WORKSPACES, workspaces);
        setAccPanel('none');
        setToast('ผูกบัญชีธนาคารเรียบร้อย');
      };

      window.unlockAdmin = (e) => {
        e.preventDefault();
        if (document.getElementById('admin-pin').value !== ADMIN_PASSCODE) return setToast('รหัสผ่านไม่ถูกต้อง');
        adminUnlocked = true;
        sessionStorage.setItem(KEYS.TAB_ADMIN, '1');
        render();
      };
      window.lockAdmin = () => {
        adminUnlocked = false;
        sessionStorage.removeItem(KEYS.TAB_ADMIN);
        setView('home');
      };
      window.selectAdminMember = (p) => { adminSelectedPhone = p; render(); };
      window.markAlertsRead = () => { alerts = alerts.map((a) => ({ ...a, readByAdmin: true })); writeLS(KEYS.ALERTS, alerts); render(); };
      window.adminAdjust = (dir) => {
        const amt = Math.abs(Number(document.getElementById('adj-amt').value || 0)) * dir;
        const ws = workspaces[adminSelectedPhone];
        if (!ws || ws.totalBalanceBaht + amt < 0) return setToast('ไม่สามารถหักเกินยอดคงเหลือได้');
        ws.totalBalanceBaht += amt;
        ws.txHistory.unshift({ id: 'tx-' + Date.now(), title: dir > 0 ? 'แอดมินเพิ่มยอดเงิน' : 'แอดมินหักยอดเงิน', amountBaht: amt, status: 'อนุมัติแล้ว' });
        writeLS(KEYS.WORKSPACES, workspaces);
        render();
        setToast('ปรับยอดเงินและซิงก์เข้าบัญชีสมาชิกเรียบร้อย');
      };
      window.toggleLvlLock = (p, lv) => {
        const ws = workspaces[p];
        ws.lockedLevels = ws.lockedLevels.includes(lv) ? ws.lockedLevels.filter((x) => x !== lv) : [...ws.lockedLevels, lv];
        writeLS(KEYS.WORKSPACES, workspaces);
        render();
      };

      render();
    </script>
  </body>
</html>
